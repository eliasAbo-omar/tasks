<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مخطط المهام اليومية الذكي</title>

    <!-- استدعاء ملفات Swiper CSS من الـ CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- ربط ملف التنسيق الخارجي الخاص بك -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>مهامي اليومية</h1>
      </header>

      <!-- سكشن إضافة المهمة والعداد المطور جنب بعض -->
      <div class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="taskInput"
            placeholder="أضف مهمتك اليومية هنا..."
            autocomplete="off"
          />
          <button id="addTaskBtn">إضافة المهمة</button>
        </div>

        <div class="progress-wrapper">
          <div class="progress-circle-container">
            <!-- طبقة البار اللي تمشي بالخلفية وتتعبى أخضر -->
            <div class="progress-bar-fill" id="progressBarFill"></div>
            <!-- النص المئوي الأمامي -->
            <div class="progress-text" id="progressPercentage">0%</div>
          </div>
        </div>
      </div>

      <!-- سكشن الـ Swiper لعرض المهام المضافة -->
      <div class="swiper-container-wrapper">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper" id="swiperWrapper">
            <!-- كروت المهام بتندف هنا ديناميكياً بالجافا سكريبت -->
          </div>
          <!-- نقاط التنقل السفلى للسوايبير -->
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>

    <!-- استدعاء مكتبة Swiper JS من الـ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- ربط ملف الجافا سكريبت الخارجي الآمن الخاص بك -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
